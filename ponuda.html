<!doctype html>
<html lang="sr-Latn" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ponuda · Nenad Bakajin</title>
  <meta name="description" content="Paketi fotografije i filma venčanja: Basic, Editorial i Premium.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261125c">
</head>
<body data-page="ponuda" data-header="light" id="top">
  <main>
    <section class="page-hero" data-dark>
      <div class="media">
        <img src="https://images.unsplash.com/photo-1595662000432-f8cdba893fa4?w=2000&q=88&auto=format" alt="" class="hero-photo">
      </div>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="inner">
        <p class="eyebrow light" data-hero-fade data-i18n="pk.hero">Fotografija · Film</p>
        <h1 class="h1 mt-m" data-i18n="pk.h1">Ponuda</h1>
      </div>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="pk-group">
          <div class="sec-head">
            <div><p class="eyebrow">01</p><h2 class="h2 mt-m" data-split data-i18n="pk.photo">Fotografija</h2></div>
          </div>
          <div class="pk-grid" id="pk-foto" data-stagger></div>
        </div>
      </div>
    </section>

    <section aria-hidden="true">
      <figure class="insert wide" data-insert style="margin:0">
        <video muted loop playsinline preload="none" poster="https://images.pexels.com/videos/39917032/pexels-photo-39917032.jpeg?auto=compress&amp;w=1600" data-src="https://videos.pexels.com/video-files/39917032/17032014_1080_1920_50fps.mp4" data-src-sm="https://videos.pexels.com/video-files/39917032/17032013_720_1280_50fps.mp4"></video>
        <figcaption class="label"><span class="t" data-i18n="pk.camera">Kamera</span><span>01</span></figcaption>
      </figure>
    </section>

    <section class="section">
      <div class="wrap">
        <div class="pk-group" style="margin-top:0">
          <div class="sec-head">
            <div><p class="eyebrow">02</p><h2 class="h2 mt-m" data-split data-i18n="pk.film">Film</h2></div>
          </div>
          <div class="pk-grid" id="pk-film" data-stagger></div>
        </div>
      </div>
    </section>

    <section class="section center on-bone" style="padding-top:clamp(64px,8vw,120px)">
      <div class="wrap">
        <p class="eyebrow" data-i18n="pk.contact">Kontakt</p>
        <h2 class="h2 mt-m" data-split data-i18n="pk.more">Saznajte više</h2>
        <a class="btn mt-l" href="kontakt.html" data-reveal><span data-i18n="pk.write">Pišite mi</span>
          <svg class="arrow" viewBox="0 0 22 8" fill="none" aria-hidden="true"><path d="M0 4h21m0 0L17.5 .5M21 4l-3.5 3.5" stroke="currentColor"/></svg></a>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="assets/js/data.js?v=20261125c"></script>
