<!doctype html>
<html lang="sr-Latn" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio · Nenad Bakajin</title>
  <meta name="description" content="Portfolio · parovi, portreti, detalji i trenuci sa venčanja.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261125b">
</head>
<body data-page="portfolio" data-header="light" id="top">
  <main>
    <section class="page-hero" data-dark>
      <div class="media">
        <img src="https://images.unsplash.com/photo-1617724975854-70b5d0cedb0a?w=2000&q=88&auto=format" alt="" class="hero-photo">
      </div>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="inner">
        <p class="eyebrow light" data-hero-fade data-i18n="pf.hero">Parovi · Portraits · Details · Snapshots</p>
        <h1 class="h1 mt-m">Portfolio</h1>
      </div>
    </section>

    <!-- Parovi -->
    <section class="section">
      <div class="wrap">
        <div class="sec-head">
          <div>
            <p class="eyebrow" data-i18n="pf.eyebrow">Galerije</p>
            <h2 class="h2 mt-m" data-split data-i18n="pf.title">Parovi</h2>
          </div>
          <p class="side couple-count" id="couple-count" data-reveal></p>
        </div>
        <div class="couple-grid" id="couple-grid"></div>
      </div>
    </section>

    <!-- Portraits · Details · Snapshots -->
    <section class="section" id="kadrovi">
      <div class="wrap">
        <div class="sec-head">
          <div><p class="eyebrow" data-i18n="pf.frames">Kadrovi</p><h2 class="h2 mt-m" data-split>Portraits, Details, Snapshots</h2></div>
          <div class="filters" role="tablist" aria-label="Filter galerije" data-reveal>
            <button type="button" role="tab" aria-selected="true" data-filter="all" data-i18n="filter.all">Sve</button>
            <button type="button" role="tab" aria-selected="false" data-filter="portraits">Portraits</button>
            <button type="button" role="tab" aria-selected="false" data-filter="details">Details</button>
            <button type="button" role="tab" aria-selected="false" data-filter="snapshots">Snapshots</button>
          </div>
        </div>
        <div class="masonry" id="portfolio-gallery"></div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="assets/js/data.js?v=20261125b"></script>
  <script src="assets/js/i18n.js?v=20261125b"></script>
  <script src="assets/js/main.js?v=20261125b"></script>
</body>
</html>
